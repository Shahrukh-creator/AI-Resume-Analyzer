<div class="container">

    <mat-card>

        <h2>AI Resume Summary</h2>

        <button
            mat-raised-button
            color="primary"
            (click)="generateSummary()"
            [disabled]="loading">

            Generate Summary

        </button>

        <div
            class="spinner"
            *ngIf="loading">

            <mat-spinner diameter="50"></mat-spinner>

            <p>Generating summary...</p>

        </div>

        <div
            class="result"
            *ngIf="summary && !loading">

            {{ summary }}

        </div>

    </mat-card>

</div>
